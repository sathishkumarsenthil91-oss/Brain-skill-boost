<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Brain boost - AI Career & Learning Acceleration</title>
    <meta name="description" content="Brain boost is an AI-powered career readiness and learning platform with personalized skill gap roadmaps, verified opportunities, Connectivity professional networking, fraud detection, and Nebula AI advisor." />
    <meta name="application-name" content="Brain boost" />
    <meta name="theme-color" content="#070b1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Brain boost" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="Brain boost - AI Career & Learning Acceleration" />
    <meta property="og:description" content="Brain boost is an AI-powered career readiness and learning platform with personalized skill gap roadmaps, verified opportunities, Connectivity professional networking, fraud detection, and Nebula AI advisor." />
    <meta property="og:image" content="https://backboost-skill1.vercel.app/brainboost-logo-512.webp" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/webp" href="/brainboost-logo-192.webp" />
    <link rel="apple-touch-icon" href="/brainboost-logo-192.webp" />

    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);

          if (params.get('native_oauth') === '1') {
            params.delete('native_oauth');
            var restQuery = params.toString();
            var callback = 'brainboost://auth-callback' +
              (restQuery ? '?' + restQuery : '') +
              (window.location.hash || '');
            window.location.replace(callback);
            return;
          }

          if (/BrainBoostAndroid/i.test(navigator.userAgent)) {
            document.documentElement.classList.add('native-app');
          }

          var saved = localStorage.getItem('brainboost_theme') || localStorage.getItem('industryskill_theme');
          var isDark = saved === 'dark';
          if (!saved) {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <style>
      #brainboost-brand-container > div:first-child {
        background: url('/brainboost-logo-192.webp') center / contain no-repeat !important;
        border-radius: 24%;
      }
      #brainboost-brand-container > div:first-child > svg,
      #brainboost-brand-container > div:first-child > div {
        display: none !important;
      }

      html.native-app {
        --native-safe-top: 0px;
        --native-safe-bottom: 0px;
        font-size: 14px;
        width: 100%;
        min-height: 100%;
        background: #f8fafc;
        overscroll-behavior: none;
      }
      html.native-app.dark {
        background: #0b1329;
      }
      html.native-app,
      html.native-app body,
      html.native-app #root {
        width: 100%;
        min-height: 100dvh;
        margin: 0;
        overflow-x: hidden !important;
      }
      html.native-app body {
        overflow-y: auto !important;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
        -webkit-tap-highlight-color: transparent;
        touch-action: pan-y pinch-zoom;
      }
      html.native-app #root {
        overflow-y: visible !important;
        position: relative;
      }
      html.native-app button,
      html.native-app a,
      html.native-app input,
      html.native-app textarea,
      html.native-app select {
        touch-action: manipulation;
      }

      @media (max-width: 767px) {
        html.native-app header.fixed.top-0 {
          top: 0 !important;
          padding-top: var(--native-safe-top) !important;
          box-sizing: border-box !important;
          min-height: calc(3.65rem + var(--native-safe-top)) !important;
        }
        html.native-app header.fixed.top-0 > div {
          height: 3.65rem !important;
          padding-left: 0.75rem !important;
          padding-right: 0.75rem !important;
        }
        html.native-app #brainboost-brand-container {
          gap: 0.4rem !important;
          max-width: 12rem;
        }
        html.native-app #brainboost-brand-container > div:first-child {
          width: 2.05rem !important;
          height: 2.05rem !important;
          min-width: 2.05rem !important;
        }
        html.native-app #brainboost-brand-container span {
          line-height: 1 !important;
        }

        html.native-app main {
          padding-top: calc(4.25rem + var(--native-safe-top)) !important;
          padding-left: 0.7rem !important;
          padding-right: 0.7rem !important;
          padding-bottom: calc(5rem + var(--native-safe-bottom)) !important;
          max-width: 100% !important;
          overflow: visible !important;
        }
        html.native-app main > * + * {
          margin-top: 0.8rem !important;
        }
        html.native-app main .rounded-3xl {
          border-radius: 1.15rem !important;
        }
        html.native-app main .p-6,
        html.native-app main .sm\:p-8 {
          padding: 0.9rem !important;
        }

        html.native-app main > div:first-child {
          padding: 0.95rem !important;
        }
        html.native-app main > div:first-child h1 {
          font-size: 1.55rem !important;
          line-height: 1.85rem !important;
        }
        html.native-app main > div:first-child p {
          line-height: 1.45 !important;
        }
        html.native-app main > div:first-child .mt-6 {
          margin-top: 0.9rem !important;
        }
        html.native-app main > div:first-child .pt-6 {
          padding-top: 0.9rem !important;
        }
        html.native-app main > div:first-child .gap-3 {
          gap: 0.55rem !important;
        }
        html.native-app main > div:first-child button {
          min-height: 2.75rem;
          padding-top: 0.6rem !important;
          padding-bottom: 0.6rem !important;
        }

        html.native-app main > div:nth-of-type(2) {
          padding: 0.9rem !important;
        }
        html.native-app main > div:nth-of-type(2) .grid {
          gap: 0.65rem !important;
        }
        html.native-app main > div:nth-of-type(2) .grid > button {
          min-height: 5.2rem !important;
          padding: 0.65rem !important;
          border-radius: 1rem !important;
        }
        html.native-app main > div:nth-of-type(2) .grid > button > div:first-child {
          width: 2.35rem !important;
          height: 2.35rem !important;
          margin-bottom: 0.4rem !important;
        }

        html.native-app nav.fixed.bottom-0 {
          border-radius: 1.05rem 1.05rem 0 0 !important;
          padding-left: 0.25rem !important;
          padding-right: 0.25rem !important;
          padding-bottom: max(0.45rem, var(--native-safe-bottom)) !important;
          box-shadow: 0 -7px 22px rgba(15, 23, 42, 0.08) !important;
        }
        html.native-app nav.fixed.bottom-0 button {
          min-width: 0 !important;
          padding: 0.3rem 0.45rem !important;
          border-radius: 0.8rem !important;
        }
        html.native-app nav.fixed.bottom-0 button .material-symbols-outlined {
          font-size: 1.35rem !important;
        }
        html.native-app nav.fixed.bottom-0 button span:last-child {
          font-size: 0.66rem !important;
        }
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#f8fafc] dark:bg-[#0b1329] text-[#0f172a] dark:text-[#f8fafc] antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(error) {
            console.warn('Brain boost service worker registration failed:', error);
          });
        });
      }
    </script>
  </body>
</html>
