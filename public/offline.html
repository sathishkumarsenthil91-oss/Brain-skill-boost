<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b1a"><title>Brain Boost — Connection</title><style>html{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#070b1a;color:#f8fafc;font-family:system-ui;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}main{max-width:420px;text-align:center}img{width:88px;height:88px;border-radius:20px}h1{font-size:26px}p{color:#cbd5e1;line-height:1.6}button{border:0;border-radius:14px;background:#7c3aed;color:white;padding:14px 32px;font:600 16px system-ui;cursor:pointer}button:focus-visible{outline:3px solid #22d3ee;outline-offset:4px}</style></head><body><main><img src="/brainboost-logo-192.webp" alt="Brain Boost"><h1 id="title">No Internet Connection</h1><p id="message">Check your Wi-Fi or mobile data, then try again. Your saved account data stays in your account.</p><button id="retry">Retry</button><p id="status" role="status" aria-live="polite"></p></main><script>
const params=new URLSearchParams(location.search);let destination='/';try{const candidate=new URL(params.get('returnTo')||'/',location.origin);if(candidate.origin===location.origin)destination=candidate.pathname+candidate.search+(candidate.hash||location.hash);}catch{}
function update(){if(navigator.onLine){document.getElementById('title').textContent='Unable to connect';document.getElementById('message').textContent='Brain Boost could not load. Please try again in a moment.';document.getElementById('status').textContent='Your connection is available. Tap Retry to reconnect.';}else{document.getElementById('title').textContent='No Internet Connection';document.getElementById('status').textContent='Waiting for an internet connection.';}}
window.addEventListener('online',update);window.addEventListener('offline',update);document.getElementById('retry').onclick=()=>{if(destination===location.pathname+location.search+location.hash)location.reload();else location.replace(destination);};update();
</script></body></html>
