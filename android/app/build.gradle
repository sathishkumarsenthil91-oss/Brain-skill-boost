plugins {
    id 'com.android.application'
}

android {
    namespace 'com.brainboost.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.brainboost.app'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '1.1.0'
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix ''
            versionNameSuffix ''
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
